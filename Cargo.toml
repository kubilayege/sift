[package]
name = "sift"
version = "0.2.0"
edition = "2024"
description = "Review what your agents changed: annotated diffs, guided walkthroughs, and a feedback loop."
license = "MIT"
repository = "https://github.com/kubilayege/sift"
homepage = "https://sift.lakebed.app"

[[bin]]
name = "sift"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
fastrand = "2"
ignore = "0.4"
imara-diff = "0.2"
lru = "0.16"
notify = "8"
regex = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
serde_json = "1"
